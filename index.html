<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雙色摺色塊</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--ink:#12343B;--ink-soft:#4C676C;--orange:#E8552D;--amber:#F4A93C;--teal:#028090;--bg:#EEF6F4;--card:#FFFFFF;--line:#D5E5E2;--chip:#E3EFED;
  --mat:#0F6B67;--mat-dark:#0A5552;--shadow:0 4px 0 rgba(18,52,59,.14);--paper-color:#E53935;--paper-white:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
:root[data-theme="dark"]{--ink:#EAF4F2;--ink-soft:#A9C2C0;--bg:#0F1F22;--card:#17302F;--line:#29474A;--chip:#21403F;--mat:#0B4F4C;--mat-dark:#083E3C;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:19px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
header.top{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,32px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo svg{width:56px;height:56px}
.logo h1{margin:0;font-size:clamp(26px,3.4vw,36px);font-weight:900;line-height:1.15}
.logo p{margin:2px 0 0;color:var(--ink-soft);font-size:16px}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700;font-size:17px}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 clamp(14px,3vw,32px) 12px}
@media (max-width:760px){.games{grid-template-columns:1fr}}
.game{display:flex;align-items:center;gap:12px;border:3px solid transparent;background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);text-align:left}
.game svg{flex:0 0 auto;width:58px;height:58px}
.game b{display:block;font-size:22px;font-weight:900;line-height:1.2}
.game small{display:block;color:var(--ink-soft);font-size:15px;line-height:1.35}
.game[aria-selected="true"]{border-color:var(--orange)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 clamp(14px,3vw,32px) 12px}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:12px;padding:8px 16px;font-weight:900;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.views button[aria-pressed="true"]{background:var(--teal);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;padding:0 clamp(14px,3vw,32px) 24px;align-items:start}
main.single{grid-template-columns:1fr}
@media (max-width:900px){main{grid-template-columns:1fr}}
.stage,.panel{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.stage{padding:18px clamp(12px,2vw,24px) 20px}
.panel{padding:16px 18px}
aside{display:flex;flex-direction:column;gap:16px}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.lv{border:none;background:var(--chip);border-radius:999px;padding:7px 16px;font-weight:700;font-size:17px}
.lv .st{color:var(--amber);letter-spacing:1px;margin-left:4px}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lvnote{color:var(--ink-soft);font-size:16px}
.challenge{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.ch-pics{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ch-pic{display:flex;flex-direction:column;align-items:center;gap:4px}
.ch-pic small{font-weight:900;color:var(--ink-soft);font-size:15px}
.ch-text{flex:1 1 280px}
.ch-title{font-size:clamp(24px,3vw,32px);font-weight:900;line-height:1.3;margin:0}
.ch-sub{margin:4px 0 0;color:var(--ink-soft);font-size:18px}
.mini{background:var(--mat);border-radius:12px;display:block}
.boardwrap{display:flex;justify-content:center}
.board{position:relative;border-radius:22px;background-color:var(--mat);background-image:linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);background-size:32px 32px;box-shadow:inset 0 0 0 6px var(--mat-dark)}
.board svg{display:block;width:100%;height:100%;touch-action:manipulation}
.caption{min-height:34px;margin-top:10px;text-align:center;font-weight:700;font-size:20px;color:var(--teal)}
.caption.warn{color:var(--orange)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.opts .btn{min-height:50px;font-size:18px}
.stepbar{display:none;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.stepbar.show{display:flex}
.step-lab{font-size:20px;font-weight:900;min-width:120px;text-align:center}
.step-lab b{font-family:"Fredoka",sans-serif;font-size:30px;color:var(--orange)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--chip);border-radius:16px;padding:8px 12px;text-align:center}
.stat small{display:block;font-size:15px;color:var(--ink-soft);font-weight:700}
.stat b{font-family:"Fredoka",sans-serif;font-size:40px;line-height:1.1}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{border:none;border-radius:16px;padding:12px 14px;font-weight:900;font-size:19px;background:var(--chip);box-shadow:0 4px 0 rgba(18,52,59,.18);display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(18,52,59,.18)}
.btn.primary{background:var(--orange);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.4;cursor:not-allowed}
.panel h2{margin:0 0 8px;font-size:20px;font-weight:900}
.note{font-size:16px;color:var(--ink-soft);margin:6px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:17px;cursor:pointer}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle span.sw{flex:0 0 auto;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle span.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked+span.sw{background:var(--teal)}
.toggle input:checked+span.sw::after{left:23px}
/* svg pieces */
.sector-line{fill:none;stroke:rgba(18,52,59,.45);stroke-width:.012}
.pinch{cursor:pointer}
.pinch circle{fill:#E8552D;stroke:#fff;stroke-width:.03}
.pinch text{fill:#fff;font-weight:900;font-family:"Noto Sans TC",sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pinch.hint circle{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.cellline{fill:none;stroke:rgba(18,52,59,.4);stroke-width:.02;stroke-dasharray:.06 .04}
.badge{font-family:"Noto Sans TC",sans-serif;font-weight:700;fill:rgba(18,52,59,.75);text-anchor:end;dominant-baseline:central}
.fl{stroke:#7FD3CF;stroke-width:.05;stroke-dasharray:.12 .08;stroke-linecap:round;pointer-events:none}
.fl-hit{stroke:transparent;stroke-width:.3;cursor:pointer;stroke-linecap:round}
.fl-g:hover .fl,.fl-g.sel .fl{stroke:#E8552D;stroke-width:.08;stroke-dasharray:none}
.fl-g.hint .fl{stroke:#F4A93C;stroke-width:.09;stroke-dasharray:none;animation:blink 1s infinite}
.zonep{fill:rgba(232,85,45,.22);stroke:rgba(232,85,45,.9);stroke-width:.03;cursor:pointer}
.zonep:hover{fill:rgba(232,85,45,.38)}
.zone-g.hint .zonep{animation:blink 1s infinite}
.zlabel rect{fill:#E8552D}.zlabel text{fill:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:900;text-anchor:middle;dominant-baseline:central}
.zlabel{cursor:pointer}
.cface{stroke:rgba(18,52,59,.35);stroke-width:.025;stroke-linejoin:round}
.pc{fill:var(--paper-color)}.pw{fill:var(--paper-white)}.pn{fill:#D9DEDF}
.underf{display:none}.flipped .underf{display:inline}.flipped .topf{display:none}
/* database */
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.db-card{background:var(--chip);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.db-card .t{font-weight:900;font-size:18px;line-height:1.35}
.db-card .m{color:var(--ink-soft);font-size:15px;font-weight:700}
.db-card .btn{min-height:44px;font-size:17px;padding:8px 14px}
.db-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.db-head h2{margin:0;font-size:24px}
/* make */
.make h2{margin:0 0 6px;font-size:26px}
.make h3{margin:18px 0 6px;font-size:21px;color:var(--teal)}
.make ol{padding-left:1.4em;margin:6px 0}
.make li{margin:6px 0;font-size:19px}
.tmpl{background:#fff;border-radius:14px;padding:10px;overflow-x:auto;border:2px dashed var(--line)}
.tmpl svg{display:block;max-width:100%;height:auto}
.facelist{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.facelist div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,30,34,.55);display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.dialog{background:var(--card);border-radius:26px;max-width:460px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog .stars{font-size:56px;color:var(--amber);letter-spacing:6px;line-height:1.2}
.dialog .stars i{font-style:normal;color:var(--line)}
.dialog .big{font-size:38px;font-weight:900;margin:4px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:16px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;color:var(--ink-soft);font-size:15px;padding:10px 16px 26px}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
  #printArea .tmpl{border:none;padding:0}
}

.games{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.game b{font-size:20px}
.mat-note{margin:0 clamp(14px,3vw,32px) 12px;background:#FFF4E5;border:2px solid #FFD8A8;border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:18px;color:#5D3A00}
.mat-note svg{flex:0 0 auto;width:54px;height:54px}
.mat-note b{color:#B23C17}
.swatches{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 10px;flex-wrap:wrap}
.swatches span{font-weight:900;font-size:16px;margin-right:4px}
.sw-btn{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw-btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw-custom{width:38px;height:38px;border:none;background:none;padding:0;cursor:pointer}
.choice-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.choice{border:4px solid transparent;background:var(--chip);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:900;font-size:22px}
.choice.ok{border-color:#2E7D32;background:#E8F5E9}.choice.bad{border-color:#C62828;background:#FFEBEE}
.choice:disabled{cursor:default}
.memo{width:150px;height:150px;border-radius:12px;background:var(--mat);display:flex;align-items:center;justify-content:center;color:#fff;font-size:60px;font-weight:900}
.count-badges{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cb{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:16px;padding:8px 14px;font-weight:900;font-size:26px}
.cb i{display:inline-block;width:34px;height:34px;border-radius:8px;border:2px solid rgba(18,52,59,.35)}
.live{font-size:17px;color:var(--ink-soft);font-weight:700;margin-top:4px}
@media (max-width:760px){.games{grid-template-columns:1fr 1fr;gap:8px}.game{padding:8px 10px}.game small{display:none}.game svg{width:40px;height:40px}.game b{font-size:18px}}

.zoomable{border:none;background:none;padding:0;cursor:zoom-in;font:inherit}
.zoomable:hover svg{outline:3px solid var(--amber);outline-offset:2px}
.zoom-dialog{max-width:min(94vw,760px);padding:18px}
.zoom-label{font-weight:900;font-size:22px;margin-bottom:8px}
.zoom-pic{display:flex;justify-content:center}
.zoom-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:560px){.zoom-tools{grid-template-columns:1fr 1fr}}
.tools .btn{min-height:48px;font-size:17px;padding:8px 14px}
.fs-exit{display:none;position:fixed;z-index:60;top:max(8px,env(safe-area-inset-top));right:10px;border:none;border-radius:14px;background:var(--ink);color:#fff;font-weight:900;font-size:16px;padding:8px 14px}
body.fs .fs-exit{display:block}
body.fs header.top,body.fs .mat-note,body.fs #modes,body.fs .bar,body.fs footer,body.fs .rules-panel,body.fs #levels{display:none!important}
body.fs main{position:fixed;inset:0;z-index:40;background:var(--bg);margin:0;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 270px;align-items:stretch;overflow:auto}
body.fs .stage{padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
body.fs aside{justify-content:center}
body.fs .ch-title{font-size:clamp(20px,2.4vw,30px)}
body.fs .ch-sub{font-size:16px}
@media (min-aspect-ratio:1/1){
  body.fs #playView{display:grid;grid-template-columns:minmax(0,34%) minmax(0,1fr);column-gap:22px;align-items:center}
  body.fs .challenge{grid-column:1;grid-row:1/span 6;flex-direction:column;align-items:center;text-align:center;margin:0;min-width:0;width:100%;overflow:hidden}
  body.fs .challenge .ch-text{max-width:100%}
  body.fs .ch-pics{gap:8px}
  body.fs .tools{flex-wrap:nowrap;gap:8px}
  body.fs .tools .btn{font-size:15px;padding:6px 10px;min-height:44px;white-space:nowrap}
  body.fs .challenge .ch-text{flex:0 0 auto}
  body.fs .ch-pics{flex-wrap:nowrap;justify-content:center}
  body.fs #playView>*:not(.challenge){grid-column:2}
}
@media (max-aspect-ratio:1/1){
  body.fs main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding-top:max(58px,env(safe-area-inset-top))}
  body.fs .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  body.fs .tools .btn{font-size:13px;padding:6px 2px;min-height:44px;white-space:nowrap}
  body.fs .challenge{justify-content:center;text-align:center;margin-bottom:6px;gap:10px}
  body.fs .challenge .ch-text{flex:1 1 100%}
  body.fs .ch-sub{display:none}
  body.fs .stats{display:none}
  body.fs .actions{grid-template-columns:repeat(3,1fr);margin-top:0}
  body.fs .actions .btn{min-height:48px;font-size:16px;padding:8px}
  body.fs .actions .btn.wide{grid-column:auto}
}
</style></head>
<body>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 2.4 2.4" aria-hidden="true"><rect x=".2" y=".2" width="2" height="2" rx=".1" class="pc" stroke="#12343B" stroke-width=".07"/><polygon points=".2,.2 1.2,.2 .2,1.2" fill="#fff" stroke="#12343B" stroke-width=".05"/><polygon points="2.2,2.2 1.2,2.2 2.2,1.2" fill="#fff" stroke="#12343B" stroke-width=".05"/></svg>
    <div><h1>雙色摺色塊</h1><p>用一面彩色、一面白色的色紙，摺出指定的色塊圖案</p></div>
  </div>
  <div class="swatches" id="swatches"><span>色紙顏色</span></div>
  <button class="ghost" id="fsBtn">全螢幕</button>
  <button class="ghost" id="soundBtn">音效 開</button>
</header>
<div class="mat-note"><svg viewBox="0 0 54 54"><rect x="6" y="8" width="38" height="38" rx="3" class="pc" stroke="#5D3A00" stroke-width="2" transform="rotate(-8 25 27)"/><rect x="12" y="10" width="38" height="38" rx="3" fill="#fff" stroke="#5D3A00" stroke-width="2"/><path d="M12 10 L50 48" stroke="#5D3A00" stroke-width="1.5" stroke-dasharray="3 2"/></svg>
  <div><b>要玩之前請準備：單面色紙</b>（一面彩色、一面白色），15×15 公分的正方形最好用。文具店、書局都買得到。紙的顏色不限，可以在上方的「色紙顏色」把網頁換成和手上一樣的顏色。</div></div>
<nav class="games" role="tablist" id="modes"></nav>
<div class="bar"><div class="seg" id="paperSeg"></div><div class="seg views" id="viewSeg"><button data-v="play" aria-pressed="true">玩挑戰</button><button data-v="db">題庫</button><button data-v="make">怎麼準備</button></div></div>
<main>
  <section class="stage">
    <div id="playView">
      <div class="levels" id="levels"></div>
      <div class="challenge" id="challenge"></div>
      <div class="boardwrap"><div class="board"><svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="world"><g id="lay0"></g><g id="lay1"></g><g id="ui"></g></g></svg></div></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="opts tools" id="viewTools"></div>
      <div class="opts" id="opts"></div>
      <div class="stepbar" id="stepbar"></div>
    </div>
    <div id="dbView" style="display:none"></div>
    <div id="makeView" style="display:none"></div>
  </section>
  <aside id="sideView">
    <div class="panel">
      <div class="stats"><div class="stat"><small>已經摺了</small><b id="stat1">0</b></div><div class="stat"><small id="stat2L">最少要摺</small><b id="stat2">–</b></div></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="panel rules-panel"><h2>規則</h2><p class="note">只能沿著摺痕摺，每次整疊一起摺。紙可以轉向、左右翻、上下翻，這些都不算步數。點淡藍色的摺線，再點要摺過去的那一邊。</p></div>
  </aside>
</main>
<footer>設計者｜愛迪樂 鍾孟修 職能治療師</footer>
<button class="fs-exit" id="fsExit">✕ 離開全螢幕</button>
<div class="overlay" id="zoomBox" role="dialog" aria-modal="true" aria-label="題目放大"><div class="dialog zoom-dialog">
  <div class="zoom-label" id="zoomLabel"></div><div id="zoomPic" class="zoom-pic"></div>
  <div class="zoom-tools"><button class="btn" data-zop="cw">↻ 順時鐘轉</button><button class="btn" data-zop="ccw">↺ 逆時鐘轉</button><button class="btn" data-zop="lr">⇆ 左右翻</button><button class="btn" data-zop="ud">⇅ 上下翻</button></div>
  <button class="btn primary" data-close style="margin-top:12px;width:100%">關閉</button></div></div>
<div class="overlay" id="winBox" role="dialog" aria-modal="true"><div class="dialog"><div class="stars" id="winStars"></div><div class="big" id="winTitle">完成了！</div><p id="winText"></p><div class="actions"><button class="btn" data-close>再看一下</button><button class="btn primary" id="winNext">下一題</button></div></div></div>

/* ---------- 通用摺紙引擎（方形紙／三角紙） ---------- */
const PAPERS={mi:{key:'mi',step:2,dirs:['v','h','d','a'],name:'米字紙'},sq:{key:'sq',step:1,dirs:['v','h'],name:'4×4 方格紙'},tri:{key:'tri',step:2,dirs:['v','h','d','a'],name:'東南西北紙'}};
let P=PAPERS.sq;
function setPaper(k){P=PAPERS[k];}
const TRI_QN={'1,0':[0,3,2,1],'0,0':[4,7,6,5],'1,1':[8,11,10,9],'0,1':[12,15,14,13]};
function initState(){
  if(P.key==='mi'){const T=[[[0,0],[2,0],[2,2]],[[0,0],[2,2],[0,2]],[[2,0],[4,0],[2,2]],[[4,0],[4,2],[2,2]],[[0,2],[2,2],[0,4]],[[2,2],[2,4],[0,4]],[[2,2],[4,2],[4,4]],[[2,2],[4,4],[2,4]]];return T.map((v,i)=>({v:v.map(p=>p.slice()),z:i,m:[1,0,0,1]}));}
  const f=new Array(16);
  if(P.key==='sq'){for(let i=0;i<16;i++){const c=i%4,r=Math.floor(i/4);f[i]={v:[[c,r],[c+1,r],[c+1,r+1],[c,r+1]],z:i,m:[1,0,0,1]};}return f;}
  for(const [q,ids] of Object.entries(TRI_QN)){const [qx,qy]=q.split(',').map(Number);const ox=2*qx,oy=2*qy,c=[ox+1,oy+1];
    const tris=[[[ox,oy],[ox+2,oy],c],[[ox+2,oy],[ox+2,oy+2],c],[[ox,oy+2],[ox+2,oy+2],c],[[ox,oy],[ox,oy+2],c]];
    ids.forEach((id,t)=>f[id]={v:tris[t].map(p=>p.slice()),z:id,m:[1,0,0,1]});}
  return f;}
const LIN={v:[-1,0,0,1],h:[1,0,0,-1],d:[0,1,1,0],a:[0,-1,-1,0]};
const fval=(t,p)=>t==='v'?p[0]:t==='h'?p[1]:t==='d'?p[0]-p[1]:p[0]+p[1];
function refl(t,c,p){const [x,y]=p;return t==='v'?[2*c-x,y]:t==='h'?[x,2*c-y]:t==='d'?[y+c,x-c]:[c-y,c-x];}
const mul=(A,B)=>[A[0]*B[0]+A[1]*B[2],A[0]*B[1]+A[1]*B[3],A[2]*B[0]+A[3]*B[2],A[2]*B[1]+A[3]*B[3]];
function side(t,c,f){let lo=false,hi=false;for(const p of f.v){const d=fval(t,p)-c;if(d<0)lo=true;if(d>0)hi=true;}return lo&&hi?0:lo?-1:1;}
const cloneF=F=>F.map(f=>({v:f.v.map(p=>p.slice()),z:f.z,m:f.m.slice()}));
function renorm(F){const o=F.map((f,i)=>i).sort((a,b)=>F[a].z-F[b].z);o.forEach((id,r)=>F[id].z=r);}
function bbox(F){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const f of F)for(const [x,y] of f.v){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}return [a,b,c,d];}
const modS=x=>((x%P.step)+P.step)%P.step;
function lines(F){const [x0,y0,x1,y1]=bbox(F);const out=[];const rng={v:[x0,x1],h:[y0,y1],d:[x0-y1,x1-y0],a:[x0+y0,x1+y1]};
  for(const t of P.dirs){const [lo,hi]=rng[t];for(let c=lo+1;c<hi;c++){if(modS(c))continue;let ok=true,L=false,H=false;
    for(const f of F){const s=side(t,c,f);if(s===0){ok=false;break;}if(s<0)L=true;else H=true;}if(ok&&L&&H)out.push([t,c]);}}return out;}
function fold(F,t,c,dir){const G=cloneF(F);let zmax=0;G.forEach(f=>{if(f.z>zmax)zmax=f.z});
  for(const f of G){if(side(t,c,f)===dir){f.v=f.v.map(p=>refl(t,c,p));f.z=zmax+1+(zmax-f.z);f.m=mul(LIN[t],f.m);}}renorm(G);return G;}
function flipF(F){const [x0,,x1]=bbox(F);const G=cloneF(F);let s=x0+x1;if(((s%P.step)+P.step)%P.step)s+=P.step-(((s%P.step)+P.step)%P.step);// 翻面軸要落在格線上，紙才會對齊摺痕
 for(const f of G){f.v=f.v.map(([x,y])=>[s-x,y]);f.z=-f.z;f.m=mul(LIN.v,f.m);}renorm(G);return G;}
const slotKey=(f,dx=0,dy=0)=>f.v.map(([x,y])=>(x-dx)+','+(y-dy)).sort().join(';');
function slots(F){const m=new Map();F.forEach((f,id)=>{const k=slotKey(f);if(!m.has(k))m.set(k,[]);m.get(k).push(id);});for(const L of m.values())L.sort((a,b)=>F[a].z-F[b].z);return m;}
function skey(F){const [x0,y0]=bbox(F);const dx=x0-modS(x0),dy=y0-modS(y0);const m=new Map();
  F.forEach((f,id)=>{const k=slotKey(f,dx,dy);if(!m.has(k))m.set(k,[]);m.get(k).push(id);});
  return [...m.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([k,L])=>k+':'+L.sort((a,b)=>F[a].z-F[b].z).map(id=>id+'.'+F[id].m.join('')).join(',')).join('|');}
function movesOf(F){const o=[];for(const [t,c] of lines(F))o.push(t+c+'-',t+c+'+');return o;}
function parseMove(m){return [m[0],+m.slice(1,-1),m[m.length-1]==='-'?-1:1];}
function applyMove(F,m){if(m==='f')return flipF(F);const [t,c,d]=parseMove(m);return fold(F,t,c,d);}
function canonView(F){const S=slots(F);let ent=[...S.entries()].map(([k,L])=>[k.split(';').map(p=>p.split(',').map(Number)),L[L.length-1]]);
  const ks=[];for(let r=0;r<4;r++){let mx=1e9,my=1e9;ent.forEach(([vs])=>vs.forEach(([x,y])=>{if(x<mx)mx=x;if(y<my)my=y;}));
    const dx=mx-modS(mx),dy=my-modS(my);
    ks.push(ent.map(([vs,id])=>vs.map(([x,y])=>(x-dx)+','+(y-dy)).sort().join(';')+'='+id).sort().join('|'));
    ent=ent.map(([vs,id])=>[vs.map(([x,y])=>[-y,x]),id]);}
  ks.sort();return ks[0];}
function shareEdge(a,b){const B=new Set(b.split(';'));let n=0;for(const x of a.split(';'))if(B.has(x))n++;return n>=2;}

function noise(len,f0,f1,vol){const c=actx();if(!c)return;const b=c.createBuffer(1,c.sampleRate*len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,c.currentTime);f.frequency.exponentialRampToValueAtTime(f1,c.currentTime+len);const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start();}
function tone(fr,t0,dur,type='triangle',vol=.22){const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=fr;g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+dur+.05);}

const isBk=f=>(f.m[0]*f.m[3]-f.m[1]*f.m[2])<0;
const md=x=>((x%P.step)+P.step)%P.step;
function rawView(F){const S=slots(F);return [...S.entries()].map(([k,L])=>[k.split(';').map(p=>p.split(',').map(Number)),isBk(F[L[L.length-1]])?0:1]);}
function norm(ent){let mx=1e9,my=1e9;ent.forEach(([vs])=>vs.forEach(([x,y])=>{if(x<mx)mx=x;if(y<my)my=y;}));const dx=mx-md(mx),dy=my-md(my);return ent.map(([vs,c])=>vs.map(([x,y])=>(x-dx)+','+(y-dy)).sort().join(';')+'='+c).sort().join('|');}
const rot=ent=>ent.map(([vs,c])=>[vs.map(([x,y])=>[-y,x]),c]);
function viewKey(F){let e=rawView(F);const ks=[];for(let r=0;r<4;r++){ks.push(norm(e));e=rot(e);}ks.sort();return ks[0];}
function pairKey(F){const a=rawView(F),b=rawView(flipF(F));const rotN=(e,n)=>{for(let i=0;i<((n%4)+4)%4;i++)e=rot(e);return e;};const ks=[];for(let r=0;r<4;r++)ks.push(norm(rotN(a,r))+'#'+norm(rotN(b,-r)));ks.sort();return ks[0];}
function counts(F){const e=rawView(F);const r=e.filter(x=>x[1]===1).length;return r+','+(e.length-r);}
const twoColor=k=>k.includes('=0')&&k.includes('=1');

/* ===================== 小圖 ===================== */
function orderPoly(vs){if(vs.length!==4)return vs;const cx=vs.reduce((s,q)=>s+q[0],0)/4,cy=vs.reduce((s,q)=>s+q[1],0)/4;return vs.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));}
function rotPts(vs,rot){rot=((rot%4)+4)%4;for(let i=0;i<rot;i++)vs=vs.map(([x,y])=>[-y,x]);return vs;}
function viewMini(key,size,o={}){const items=key.split('|').map(s=>{const [vs,c]=s.split('=');return {v:rotPts(orderPoly(vs.split(';').map(q=>q.split(',').map(Number))),o.rot||0).map(([x,y])=>[o.mirror?-x:x,y]),c:+c};});
  let A=1e9,B=1e9,C=-1e9,D=-1e9;items.forEach(o=>o.v.forEach(([x,y])=>{A=Math.min(A,x);B=Math.min(B,y);C=Math.max(C,x);D=Math.max(D,y);}));
  const sz=Math.max(C-A,D-B,2);const pad=.3;const svg=el('svg',{viewBox:`${(A+C)/2-sz/2-pad} ${(B+D)/2-sz/2-pad} ${sz+2*pad} ${sz+2*pad}`,width:size,height:size,class:'mini'});
  items.forEach(it=>el('polygon',{points:it.v.map(p=>p.join(',')).join(' '),class:'cface '+(o.gray?'pn':it.c?'pc':'pw')},svg));return svg;}

function drawZoom(){const z=zoom;const box=$('zoomPic');box.innerHTML='';const size=Math.floor(Math.min(window.innerWidth*0.82,window.innerHeight*0.62,620));
  let svg;if(!z.flipped)svg=viewMini(z.front,size,{rot:z.rot});else if(z.back)svg=viewMini(z.back,size,{rot:z.rot});else svg=viewMini(z.front,size,{rot:-z.rot,mirror:true,gray:true});
  box.appendChild(svg);$('zoomLabel').textContent=!z.flipped?'目前看到：上面':(z.back?'目前看到：翻過來的那一面':'翻過來的那一面不指定，什麼顏色都可以');}
function zoomOp(op){if(!zoom)return;const z=zoom;sTick();
  if(op==='cw')z.rot++;else if(op==='ccw')z.rot--;else if(op==='lr'){z.flipped=!z.flipped;z.rot=-z.rot;}else if(op==='ud'){z.flipped=!z.flipped;z.rot=-z.rot+2;}

function targetSize(pair){if(!document.body.classList.contains('fs'))return pair?140:170;const land=window.innerWidth>=window.innerHeight;
  if(pair)return Math.floor(land?Math.min(window.innerWidth*0.145,window.innerHeight*0.42):Math.min(window.innerWidth*0.4,window.innerHeight*0.17));

    cur=c;lastPick[mode+paper]=c.id;goal=goalOf(c);}else{cur=null;goal=null;}

/* ----- 猜猜看 ----- */
function startGuess(){// 選兩個干擾選項
  const all=Object.keys(DATA[paper].vall).filter(k=>k!==cur.key&&twoColor(k));const n=cur.key.split('|').length;
  const same=all.filter(k=>k.split('|').length===n);const pool=(same.length>=2?same:all).slice();const pick=[];while(pick.length<2&&pool.length){pick.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
  const opts=[cur.key,...pick].sort(()=>Math.random()-.5);guessState={opts,answered:false,revealed:false};
  st=initState();hist=[];steps=0;resetView();
  const seq=cur.sol;const states=[st];
  stp={guess:true,n:seq.length,i:0,seq,states,fwd:async i=>{hist.push({st,steps});if(seq[i]!=='f')steps++;await animate(seq[i]);states[i+1]=st;},
    back:async i=>{hist.pop();if(seq[i]!=='f')steps--;st=states[i];resetView();renderBoard();sTick();},
    show:i=>{setCaption(i===0?`一開始彩色面朝上。第 1 步：${moveText(seq[i])}`:`第 ${i+1} 步：${moveText(seq[i])}`);renderBoard({stepMove:seq[i]});},
    onEnd:()=>{setCaption('摺好了！猜猜看，最上面會是哪一個樣子？');renderBoard();showGuessOptions();}};
  stepShow();}
function showGuessOptions(){const box=$('opts');box.innerHTML='';const row=document.createElement('div');row.className='choice-row';
  guessState.opts.forEach((k,i)=>{const b=document.createElement('button');b.className='choice';b.appendChild(viewMini(k,120));const s=document.createElement('span');s.textContent='ABC'[i];b.appendChild(s);
    b.onclick=()=>answerGuess(i,row);row.appendChild(b);});box.appendChild(row);}
function answerGuess(i,row){if(guessState.answered)return;guessState.answered=true;const ok=guessState.opts[i]===cur.key;const ci=guessState.opts.indexOf(cur.key);
  [...row.children].forEach((b,j)=>{b.disabled=true;if(j===ci)b.classList.add('ok');else if(j===i)b.classList.add('bad');});
  guessState.revealed=true;stp=null;renderStepbar();renderBoard();renderActions();
  if(ok){setCaption('答對了！');showWin(usedHelp?2:3,'答對了！','看看紙上的色塊，和你選的一模一樣。');}

/* ----- 提示與解答 ----- */
function solveFrom(s,g,limit=60000){if(g(s))return [];const k0=skey(s);const seen=new Map([[k0,null]]);let front=[[s,k0]],count=0;
  const path=k=>{const p=[];while(seen.get(k)){p.push(seen.get(k)[1]);k=seen.get(k)[0];}return p.reverse();};
  while(front.length){const lvl=front.slice();for(const [x,k] of front){const f=flipF(x),kf=skey(f);if(!seen.has(kf)){seen.set(kf,[k,'f']);if(g(f))return path(kf);lvl.push([f,kf]);}}
    const nxt=[];for(const [x,k] of lvl){for(const m of movesOf(x)){const t=applyMove(x,m),kt=skey(t);if(seen.has(kt))continue;seen.set(kt,[k,m]);if(g(t))return path(kt);nxt.push([t,kt]);if(++count>limit)return null;}}front=nxt;}return null;}
function getSol(){if(cur.sol)return cur.sol;const p=solveFrom(initState(),goal,200000);cur.sol=p;if(p&&cur.d==null)cur.d=p.filter(m=>m!=='f').length;return p;}
function hint(){if(busy||solved||!cur)return;setCaption('想一想……');busy=true;
  setTimeout(()=>{const sol=getSol();let p=null;if(sol){if(!solKeys){solKeys=[];let s=initState();solKeys.push(skey(s));for(const m of sol){s=applyMove(s,m);solKeys.push(skey(s));}}const i=solKeys.lastIndexOf(skey(st));if(i>=0&&i<sol.length)p=sol.slice(i);}
    if(!p)p=solveFrom(st,goal);busy=false;usedHelp=true;
    if(!p){let back=-1;if(solKeys)for(let j=hist.length-1;j>=0;j--){if(solKeys.includes(skey(hist[j].st))){back=hist.length-j;break;}}
      setCaption(back>0?`提示：先按 ${back} 次「上一步」，回到對的路上再繼續`:'從這裡比較難走到，建議按「攤開重來」，或看解答',true);renderBoard();return;}
    const m=p[0];const left=p.filter(x=>x!=='f').length;if(m==='f'){setCaption(`提示：先把紙翻面看看（還要摺 ${left} 次）`);renderBoard();return;}
    setCaption(`提示：${moveText(m)}（還要摺 ${left} 次）`);renderBoard({stepMove:m});},40);}
function playSolution(){if(busy)return;const sol=getSol();if(!sol){setCaption('這一題找不到解答',true);return;}usedHelp=true;solved=false;st=initState();hist=[];steps=0;sel=null;resetView();updateStats();
  const states=[st];stp={n:sol.length,i:0,seq:sol,states,fwd:async i=>{hist.push({st,steps});if(sol[i]!=='f')steps++;await animate(sol[i]);states[i+1]=st;},
    back:async i=>{hist.pop();if(sol[i]!=='f')steps--;st=states[i];resetView();renderBoard();sTick();},
    show:i=>{setCaption(`第 ${i+1} 步：${moveText(sol[i])}`);renderBoard({stepMove:sol[i]});},
    onEnd:()=>{setCaption('完成了！可以用下面的按鈕轉向、翻面，和題目對照；也可以按「上一步」倒回去再看。');renderBoard();sWin();}};
  stepShow();}
function exitSolution(){if(busy)return;autoFlag=false;stp=null;solved=goal?goal(st):false;renderBoard();renderStepbar();renderActions();setCaption(solved?'完成了！':'從這裡開始，換你自己摺摺看');}
function renderStepbar(){const sb=$('stepbar');sb.innerHTML='';if(!stp){sb.classList.remove('show');return;}sb.classList.add('show');const done=stp.i>=stp.n;
  const lab=document.createElement('div');lab.className='step-lab';lab.innerHTML=done?'全部完成':`第 <b>${stp.i+1}</b> / ${stp.n} 步`;
  sb.append(btn('◀ 上一步','',stepPrev,busy||stp.i<=0),lab,btn('下一步 ▶','primary',stepNext,busy||done),btn('自動播完','',stepAuto,busy||done));}
async function stepNext(){if(busy||!stp||stp.i>=stp.n)return;busy=true;renderStepbar();renderActions();await stp.fwd(stp.i);if(!stp){busy=false;return;}stp.i++;busy=false;stepShow();}
async function stepPrev(){if(busy||!stp||stp.i<=0)return;autoFlag=false;busy=true;await stp.back(stp.i-1);stp.i--;busy=false;stepShow();}
async function stepAuto(){if(busy||!stp)return;autoFlag=true;const me=stp;while(stp===me&&stp.i<stp.n&&autoFlag){await stepNext();if(stp===me&&stp.i<stp.n)await wait(700);}autoFlag=false;}
function stepShow(){$('stat1').textContent=steps;if(stp){if(stp.i>=stp.n)stp.onEnd();else stp.show(stp.i);}renderStepbar();renderActions();}

/* ===================== 轉向與翻面（不算步數） ===================== */
function rotF(F,dir){const G=cloneF(F);const Rm=dir>0?[0,-1,1,0]:[0,1,-1,0];G.forEach(f=>{f.v=f.v.map(([x,y])=>dir>0?[-y,x]:[y,-x]);f.m=mul(Rm,f.m);});
  const [x0,y0]=bbox(G);const dx=x0-modS(x0),dy=y0-modS(y0);G.forEach(f=>f.v=f.v.map(([x,y])=>[x-dx,y-dy]));return G;}
function flipUD(F){const [,y0,,y1]=bbox(F);const G=cloneF(F);let s=y0+y1;if(md(s))s+=P.step-md(s);G.forEach(f=>{f.v=f.v.map(([x,y])=>[x,s-y]);f.z=-f.z;f.m=mul(LIN.h,f.m);});renorm(G);return G;}
const stepDone=()=>stp&&stp.i>=stp.n;
async function viewOp(op){if(busy||(stp&&!stepDone())||(mode==='guess'&&guessState&&!guessState.answered))return;busy=true;sel=null;renderActions();hist.push({st,steps});
  if(op==='lr'){await animate('f');}
  else{const W=$('world');const cx=2.3,cy=2.3;const base=`translate(${cview.tx} ${cview.ty})`;swish();
    if(op==='ud'){await tween(240,k=>W.setAttribute('transform',`translate(${cx} ${cy}) scale(1 ${1-ease(k)}) translate(${-cx} ${-cy}) ${base}`));st=flipUD(st);resetView();renderBoard();const b2=`translate(${cview.tx} ${cview.ty})`;
      await tween(260,k=>W.setAttribute('transform',`translate(${cx} ${cy}) scale(1 ${ease(k)}) translate(${-cx} ${-cy}) ${b2}`));}
    else{const d=op==='cw'?1:-1;await tween(320,k=>W.setAttribute('transform',`rotate(${d*90*ease(k)} ${cx} ${cy}) ${base}`));st=rotF(st,d);}
    resetView();renderBoard();}
  busy=false;if(stp){renderBoard();renderStepbar();renderActions();setCaption('可以繼續轉向、翻面，和題目的圖案對照看看');return;}
  if(goal&&goal(st)){solved=true;renderBoard();renderActions();celebrate();return;}renderBoard();renderActions();updateStats();if(mode!=='count')setCaption('');}
function renderTools(){const t=$('viewTools');t.innerHTML='';const dis=busy||(!!stp&&!stepDone())||(mode==='guess'&&guessState&&!guessState.answered);
  [['cw','↻ 順時鐘轉'],['ccw','↺ 逆時鐘轉'],['lr','⇆ 左右翻'],['ud','⇅ 上下翻']].forEach(([op,l])=>t.appendChild(btn(l,'',()=>viewOp(op),dis)));}

let cview={tx:0,ty:0};
function resetView(){$('board').setAttribute('viewBox','0 0 4.6 4.6');const [x,y]=centerOf(st);cview={tx:x,ty:y};$('world').setAttribute('transform',`translate(${x} ${y})`);}
function centerOf(F){const [a,b,c,d]=bbox(F);return [2.3-(a+c)/2,2.3-(b+d)/2];}
function clearLayers(){['lay0','lay1','ui'].forEach(id=>{const g=$(id);g.innerHTML='';g.removeAttribute('transform');g.classList.remove('flipped');});}
const neutral=()=>mode==='guess'&&guessState&&!guessState.revealed;
function renderBoard(o={}){clearLayers();const L0=$('lay0'),L1=$('lay1'),U=$('ui');const S=slots(st);const nt=neutral();
  for(const [k,L] of S){const f=st[L[L.length-1]];let g=L0;if(o.all)g=L1;else if(o.move&&side(o.move[0],o.move[1],f)===o.move[2])g=L1;
    const pts=f.v.map(p=>p.join(',')).join(' ');el('polygon',{points:pts,class:'cface topf '+(nt?'pn':isBk(f)?'pw':'pc')},g);
    if(g===L1){// 翻過去時看到的是這一疊最底下那片的另一面
      const b=st[L[0]];el('polygon',{points:pts,class:'cface underf '+(nt?'pn':isBk(b)?'pc':'pw')},g);}}
  const can=!busy&&!solved&&!stp&&mode!=='guess';
  if(can){for(const [t,c] of lines(st)){const [p,q]=lineSeg(t,c,st);const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy),ex=dx/l*.18,ey=dy/l*.18;const g=el('g',{class:'fl-g'+(sel&&sel[0]===t&&sel[1]===c?' sel':'')},U);
      el('line',{x1:p[0]-ex,y1:p[1]-ey,x2:q[0]+ex,y2:q[1]+ey,class:'fl-hit'},g);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'fl'},g);
      g.addEventListener('click',()=>{sTick();sel=sel&&sel[0]===t&&sel[1]===c?null:[t,c];setCaption(sel?'再點一下要摺過去的那一邊':(mode==='count'?liveCount():''));renderBoard();});}
    if(sel){const [t,c]=sel;for(const dir of [-1,1])zoneFor(U,t,c,dir,'',()=>doMove(t+c+(dir<0?'-':'+')));}}
  if(o.stepMove&&o.stepMove!=='f'){const [t,c,dir]=parseMove(o.stepMove);zoneFor(U,t,c,dir,'hint');const [p,q]=lineSeg(t,c,st);const g=el('g',{class:'fl-g hint'},U);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:'fl'},g);}}
function lineSeg(t,c,Fs){const pts=[];for(const f of Fs)for(const p of f.v)if(fval(t,p)===c)pts.push(p);const key=t==='v'?p=>p[1]:p=>p[0];pts.sort((a,b)=>key(a)-key(b));return [pts[0],pts[pts.length-1]];}
const sideText=(t,dir)=>({'v-1':'往右摺 ▶','v1':'◀ 往左摺','h-1':'往下摺 ▼','h1':'▲ 往上摺','d-1':'往右上摺 ◥','d1':'◣ 往左下摺','a-1':'往右下摺 ◢','a1':'◤ 往左上摺'}[t+dir]);
function zoneFor(U,t,c,dir,cls,click){const g=el('g',{class:'zone-g '+(cls||'')},U);let sx=0,sy=0,n=0;
  for(const [k,L] of slots(st)){const f=st[L[L.length-1]];if(side(t,c,f)!==dir)continue;el('polygon',{points:f.v.map(p=>p.join(',')).join(' '),class:'zonep'},g);sx+=f.v.reduce((s,p)=>s+p[0],0)/f.v.length;sy+=f.v.reduce((s,p)=>s+p[1],0)/f.v.length;n++;}
  if(n){const lx=sx/n,ly=sy/n,lab=el('g',{class:'zlabel'},g);const txt=sideText(t,dir);const w=.2*txt.length+.1;el('rect',{x:lx-w/2,y:ly-.2,width:w,height:.4,rx:.2},lab);const tt=el('text',{x:lx,y:ly,'font-size':.2},lab);tt.textContent=txt;}
  if(click)g.addEventListener('click',click);}
function moveText(m){if(m==='f')return '把整張紙左右翻面';const [t,c,d]=parseMove(m);
  return {'v-1':'沿著直的摺痕，把左邊往右摺過去','v1':'沿著直的摺痕，把右邊往左摺過去','h-1':'沿著橫的摺痕，把上面往下摺過去','h1':'沿著橫的摺痕，把下面往上摺過去','d-1':'沿著斜的摺痕，把左下那一邊往右上摺過去','d1':'沿著斜的摺痕，把右上那一邊往左下摺過去','a-1':'沿著斜的摺痕，把左上那一邊往右下摺過去','a1':'沿著斜的摺痕，把右下那一邊往左上摺過去'}[t+d];}
function axisMatrix(t,c,s){const r=Math.SQRT1_2;const n=t==='v'?[1,0]:t==='h'?[0,1]:t==='d'?[r,-r]:[r,r];const cp=(t==='d'||t==='a')?c*r:c;const k=1-s;const a=1-k*n[0]*n[0],bb=-k*n[0]*n[1],d=1-k*n[1]*n[1];return `matrix(${a} ${bb} ${bb} ${d} ${k*cp*n[0]} ${k*cp*n[1]})`;}
async function animate(m){swish();const L1=$('lay1');let t,c,dir;if(m==='f'){const [x0,,x1]=bbox(st);t='v';c=(x0+x1)/2;renderBoard({all:true});}else{[t,c,dir]=parseMove(m);renderBoard({move:[t,c,dir]});}
  $('ui').innerHTML='';await tween(520,k=>{const s=1-2*ease(k);L1.setAttribute('transform',axisMatrix(t,c,s));L1.classList.toggle('flipped',s<0&&!neutral());});
  st=applyMove(st,m);renderBoard();const [nx,ny]=centerOf(st);const ox=cview.tx,oy=cview.ty;await tween(300,k=>{const e=ease(k);cview={tx:ox+(nx-ox)*e,ty:oy+(ny-oy)*e};$('world').setAttribute('transform',`translate(${cview.tx} ${cview.ty})`);});}

<h3>東南西北紙：摺出 16 個三角形</h3><div id="mkTri"></div>
<ol><li>彩色面朝上，上下對摺、左右對摺再打開，摺出十字。</li><li>沿兩條對角線各摺一次再打開，摺出「米」字。</li><li>把四個角往中心點摺，再打開，摺痕會圍成一個菱形。攤開後共有 16 個三角形。</li></ol>
<h3>規則</h3><ul><li>只能沿著摺痕摺，每次整疊一起摺。</li><li>紙可以翻面、轉方向；翻面不算步數。</li><li>題目裡的彩色是色紙的彩色面，白色是背面。</li></ul>
<h3>帶領方法</h3><ul>
<li>先從「照圖摺」的暖身題開始，讓大家發現摺過去的地方會變成白色。</li>
<li>「數色塊」答案不只一種，可以請大家比比看彼此的摺法。</li>
<li>「猜猜看」先不要動手，只看投影上的摺法在心裡想像，選好答案後再用手上的紙照著摺來驗證。</li>
<li>「記憶挑戰」圖案只出現幾秒，適合想練記憶的長輩；記不住可以按「再看一眼」。</li>
<li>「自由創作」可以請長輩自己摺一個圖案存成題目，再換別人來挑戰。</li></ul></div>`;
  $('mkSq').appendChild(creaseSVG('sq',200));$('mkTri').appendChild(creaseSVG('tri',200));}

/* ===================== 切換 ===================== */
function renderModes(){const n=$('modes');n.innerHTML='';Object.entries(MODES).forEach(([k,m])=>{const b=document.createElement('button');b.className='game';b.setAttribute('role','tab');b.setAttribute('aria-selected',k===mode);
  b.innerHTML=`<svg viewBox="0 0 2.4 2.4">${m.ic}</svg><span><b>${m.name}</b><small>${m.sub}</small></span>`;b.onclick=()=>{if(busy)return;mode=k;renderModes();setView('play');newPuzzle();};n.appendChild(b);});}
function renderPaperSeg(){const s=$('paperSeg');s.innerHTML='';[['sq','4×4 方格紙'],['tri','東南西北紙']].forEach(([k,n])=>{const b=document.createElement('button');b.style.cssText='display:flex;align-items:center;gap:8px';const ic=creaseSVG(k,30);ic.style.flex='0 0 auto';b.appendChild(ic);b.appendChild(document.createTextNode(n));b.setAttribute('aria-pressed',k===paper);b.onclick=()=>{if(busy)return;paper=k;buildBank();renderPaperSeg();newPuzzle();if(view!=='play')setView(view);};s.appendChild(b);});}
function setView(v){view=v;document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  $('playView').style.display=v==='play'?'':'none';$('dbView').style.display=v==='db'?'':'none';$('makeView').style.display=v==='make'?'':'none';$('sideView').style.display=v==='play'?'':'none';
  document.querySelector('main').classList.toggle('single',v!=='play');if(v==='db')renderDB();if(v==='make')renderMake();}
function measure(){const bd=document.querySelector('.board');const wrap=document.querySelector('.boardwrap');let s;
  if(document.body.classList.contains('fs')){bd.style.width=bd.style.height='10px';const land=window.innerWidth>=window.innerHeight;const w=wrap.clientWidth||400;
    const used=land?200:(document.querySelector('.challenge').offsetHeight+document.getElementById('sideView').offsetHeight+document.getElementById('viewTools').offsetHeight+150);
    s=Math.floor(Math.max(220,Math.min(w,window.innerHeight-used)));}
  else{const w=wrap.clientWidth||500;s=Math.floor(Math.max(300,Math.min(w,window.innerHeight*0.62,600)));}
  bd.style.width=bd.style.height=s+'px';}
function setFS(on){document.body.classList.toggle('fs',on);$('fsBtn').textContent=on?'離開全螢幕':'全螢幕';
  try{if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}catch(e){}
  if(on&&view!=='play')setView('play');requestAnimationFrame(()=>{if(mode!=='memory')renderChallenge();measure();requestAnimationFrame(measure);});}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs'))setFS(false);});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('soundBtn').onclick=()=>{soundOn=!soundOn;store.set('tc-sound',soundOn);$('soundBtn').textContent='音效 '+(soundOn?'開':'關');sTick();};$('soundBtn').textContent='音效 '+(soundOn?'開':'關');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('show'));
$('winNext').onclick=()=>{$('winBox').classList.remove('show');newPuzzle();};
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(document.body.classList.contains('fs')&&mode!=='memory'&&mode!=='guess')renderChallenge();measure();if(zoom&&$('zoomBox').classList.contains('show'))drawZoom();},120);});
$('fsBtn').onclick=()=>setFS(!document.body.classList.contains('fs'));$('fsExit').onclick=()=>setFS(false);
document.querySelectorAll('[data-zop]').forEach(b=>b.onclick=()=>zoomOp(b.dataset.zop));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('zoomBox').classList.contains('show'))$('zoomBox').classList.remove('show');else if(document.body.classList.contains('fs'))setFS(false);}});
$('zoomBox').addEventListener('click',e=>{if(e.target===$('zoomBox'))$('zoomBox').classList.remove('show');});
buildSwatches();applyColor(paperColor);buildBank();renderModes();renderPaperSeg();measure();newPuzzle();setView('play');
